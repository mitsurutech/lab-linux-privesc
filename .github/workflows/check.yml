name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The lab is valid YAML and inside the platform's limits
        run: |
          python3 - <<'PY'
          import yaml
          d = yaml.safe_load(open('linux-privesc.lab.yaml'))
          for key in ('cpus', 'memory', 'disk', 'setup'):
              assert key in d, f'no {key}'
          assert 'check' not in d, 'this lab is read by the teacher: it has no check'
          size = len(d['setup'].encode())
          assert size <= 16384, f'setup is {size} bytes, over 16 KB'
          print('linux-privesc.lab.yaml ok')
          PY
