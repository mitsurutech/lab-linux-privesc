# Linux privilege escalation
# One Ubuntu VM with a low-privilege account, intern, and three ordinary administrator
# mistakes left for it to find: a setuid helper, a passwordless sudo rule and a writable
# script root's own cron runs every minute.
cpus: 1
memory: 1024    # MB
disk: 6         # GB

# Nothing opens in the browser: the lab is the terminal.
open: []

# Run once, as root. Its output is kept in /var/log/mitsurutech-setup.log on the VM.
setup: |
  export DEBIAN_FRONTEND=noninteractive
  apt-get update -qq
  apt-get install -y -qq cron vim
  FLAG=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
  echo "$FLAG" > /root/flag.txt
  chmod 600 /root/flag.txt
  chown root:root /root/flag.txt
  id intern >/dev/null 2>&1 || useradd -m -s /bin/bash intern
  echo 'intern:StudentLab2026' | chpasswd
  # A diagnostics helper somebody made so intern could search the logs without the root
  # password, a copy of find carrying the setuid bit find was never meant to have.
  cp /usr/bin/find /usr/local/bin/sysfind
  chown root:root /usr/local/bin/sysfind
  chmod 4755 /usr/local/bin/sysfind
  # A sudo rule somebody added so intern could edit a config file as root with vim, with no
  # password, and never narrowed down afterwards.
  mkdir -p /etc/sudoers.d
  cat > /etc/sudoers.d/90-lab-intern <<'SUDOERS_END'
  intern ALL=(root) NOPASSWD: /usr/bin/vim
  SUDOERS_END
  chmod 440 /etc/sudoers.d/90-lab-intern
  visudo -cf /etc/sudoers.d/90-lab-intern >/dev/null 2>&1
  # A maintenance script root's own cron runs every minute, left writable by anybody at all.
  mkdir -p /opt/maintenance
  cat > /opt/maintenance/cleanup.sh <<'CLEANUP_END'
  #!/bin/bash
  find /tmp -type f -mmin +60 -delete 2>/dev/null
  CLEANUP_END
  chmod 777 /opt/maintenance/cleanup.sh
  chown root:root /opt/maintenance/cleanup.sh
  ( crontab -l -u root 2>/dev/null; echo "* * * * * /opt/maintenance/cleanup.sh" ) | crontab -u root -
  home=/home/student
  [ -d $home ] || home=/root
  cat > $home/README.md <<'PRIVESC_README_END'
  # Lab: Linux privilege escalation

  This is a security exercise inside your own private virtual machine. Attack only this
  machine: it has no route to any other student's machine or to anything else on the internet,
  and the only way out of it at all is a narrow proxy that allows Ubuntu's own package archive,
  PyPI, npm and GitHub, nothing else. Never point anything you learn here at a machine that is
  not your own: under the Computer Misuse Act 1990, doing so without permission is a criminal
  offence.

  A second account already exists on this machine, called intern. Its password is
  StudentLab2026. Switch to it from your own shell with:

      su - intern

  intern has no sudo rights of its own and does not know the root password. Somewhere on this
  machine, root has left at least one ordinary mistake that lets intern reach root anyway: a
  program that runs with more privilege than it should, a sudo rule that was never narrowed
  down, or a scheduled job that trusts a file it should not. Find one, use it, and read
  /root/flag.txt.

  Hand in a short write-up: which weakness you used, the commands that got you to root, and
  what /root/flag.txt said. Your teacher reads it, nothing on this machine marks it.

  This lab does not ask you to fix what you found afterwards, and a teacher may set remediation as
  separate, further work.
  PRIVESC_README_END
  chown student:student $home/README.md 2>/dev/null
  echo "Read README.md in your home folder first." > /etc/motd
